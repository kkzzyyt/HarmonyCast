name: Build Native C++ App (macOS & Windows)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG (Universal/Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt6, FFmpeg and create-dmg
        run: |
          brew update
          brew install qt ffmpeg create-dmg

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt;/opt/homebrew/opt/ffmpeg"

      - name: Build HarmonyCast Executable
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Run C++ Core Verification Tests
        run: |
          ./build/test_harmonycast_core

      - name: Package Standalone macOS DMG
        run: |
          chmod +x ./scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyCast-macOS-arm64
          path: build/HarmonyCast-*-macOS-arm64.dmg

  build-windows:
    name: Build Windows x64 Executable & Single EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Install FFmpeg via vcpkg
        run: |
          vcpkg install ffmpeg:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build HarmonyCast
        run: |
          cmake --build build --config Release

      - name: Deploy Qt Dependencies with windeployqt
        run: |
          windeployqt build/Release/HarmonyCast.exe --no-translations --compiler-runtime

      - name: Copy Resources to Release Directory
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force resources build/Release/resources

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(HarmonyCast VERSION ([0-9.]+)').Matches.Groups[1].Value
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Single-File Portable EXE and Setup Installer via NSIS
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $portable_out = "build\HarmonyCast-$ver-Windows-x64.exe"
          $setup_out = "build\HarmonyCast-$ver-Setup-x64.exe"
          
          # 1. Build Single-File Portable EXE ("就一个exe文件")
          makensis /DICON_PATH="resources/app-icon.ico" `
                   /DSTAGING_DIR="build/Release" `
                   /DOUTPUT_EXE="$portable_out" `
                   scripts/windows/portable.nsi

          # 2. Build 1-Click Setup Installer EXE
          makensis /DICON_PATH="resources/app-icon.ico" `
                   /DSTAGING_DIR="build/Release" `
                   /DOUTPUT_SETUP="$setup_out" `
                   scripts/windows/installer.nsi

          # 3. Create fallback ZIP package
          Compress-Archive -Path build/Release/* -DestinationPath "build\HarmonyCast-$ver-Windows-x64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyCast-Windows-x64
          path: |
            build/HarmonyCast-*-Windows-x64.exe
            build/HarmonyCast-*-Setup-x64.exe
            build/HarmonyCast-*-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: HarmonyCast-macOS-arm64
          path: release-artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: HarmonyCast-Windows-x64
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
