name: Bug report / 问题反馈
description: Report a reproducible HarmonyCast issue.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Host OS, device architecture, system/API version, HDC version and mirroring mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior / 重现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual behavior / 实际结果
      description: Include only logs and screenshots you intend to make public.
    validations:
      required: true
